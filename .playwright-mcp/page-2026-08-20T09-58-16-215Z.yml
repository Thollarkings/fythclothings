          - heading "Materials & Tools" [level=3] [ref=f3e42]
          - paragraph [ref=f3e43]: Students are responsible for providing their personal sewing tools, fabrics and other materials required for training unless otherwise agreed.
        - generic [ref=f3e44]:
          - heading "Attendance & Punctuality" [level=3] [ref=f3e45]
          - paragraph [ref=f3e46]: Students are expected to attend scheduled classes and arrive on time. Where possible, absence should be communicated in advance.
        - generic [ref=f3e47]:
          - heading "Missed Classes" [level=3] [ref=f3e48]
          - paragraph [ref=f3e49]: Missed classes do not automatically qualify for a make-up class. Any make-up arrangement is subject to the trainer's availability and approval.
        - generic [ref=f3e50]:
          - heading "Practice & Progress" [level=3] [ref=f3e51]
          - paragraph [ref=f3e52]: Students are encouraged to practise between lessons. Progress depends on attendance, participation, practice and commitment.
        - generic [ref=f3e53]:
          - heading "Conduct" [level=3] [ref=f3e54]
          - paragraph [ref=f3e55]: Students are expected to treat the trainer and other students with respect. Abusive, threatening or disruptive behaviour will not be accepted.
        - generic [ref=f3e56]:
          - heading "Training Content" [level=3] [ref=f3e57]
          - paragraph [ref=f3e58]: Training content may be adjusted according to the student's level, progress, learning needs and agreed programme.
        - generic [ref=f3e59]:
          - heading "Photos & Videos" [level=3] [ref=f3e60]
          - paragraph [ref=f3e61]: Students may be photographed or recorded during training for documentation or promotional purposes only where consent has been given.
