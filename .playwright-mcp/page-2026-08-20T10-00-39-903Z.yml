          - heading "Training Fees" [level=3] [ref=f5e36]
          - paragraph [ref=f5e37]: Training fees are based on the programme agreed with the student. Any outstanding balance must be paid according to the agreed payment arrangement.
        - generic [ref=f5e38]:
          - heading "STRICT NO-REFUND POLICY" [level=3] [ref=f5e39]
          - paragraph [ref=f5e40]: ALL PAYMENTS MADE FOR TRAINING ARE STRICTLY NON-REFUNDABLE. ONCE PAYMENT HAS BEEN MADE, NO REFUND WILL BE ISSUED, WHETHER OR NOT THE STUDENT COMPLETES THE TRAINING.
        - generic [ref=f5e41]:
          - heading "Materials & Tools" [level=3] [ref=f5e42]
          - paragraph [ref=f5e43]: Students are responsible for providing their personal sewing tools, fabrics and other materials required for training unless otherwise agreed.
        - generic [ref=f5e44]:
          - heading "Attendance & Punctuality" [level=3] [ref=f5e45]
          - paragraph [ref=f5e46]: Students are expected to attend scheduled classes and arrive on time. Where possible, absence should be communicated in advance.
        - generic [ref=f5e47]:
          - heading "Missed Classes" [level=3] [ref=f5e48]
          - paragraph [ref=f5e49]: Missed classes do not automatically qualify for a make-up class. Any make-up arrangement is subject to the trainer's availability and approval.
        - generic [ref=f5e50]:
          - heading "Practice & Progress" [level=3] [ref=f5e51]
          - paragraph [ref=f5e52]: Students are encouraged to practise between lessons. Progress depends on attendance, participation, practice and commitment.
        - generic [ref=f5e53]:
          - heading "Conduct" [level=3] [ref=f5e54]
          - paragraph [ref=f5e55]: Students are expected to treat the trainer and other students with respect. Abusive, threatening or disruptive behaviour will not be accepted.
        - generic [ref=f5e56]:
          - heading "Training Content" [level=3] [ref=f5e57]
          - paragraph [ref=f5e58]: Training content may be adjusted according to the student's level, progress, learning needs and agreed programme.
        - generic [ref=f5e59]:
          - heading "Photos & Videos" [level=3] [ref=f5e60]
          - paragraph [ref=f5e61]: Students may be photographed or recorded during training for documentation or promotional purposes only where consent has been given.
        - generic [ref=f5e62]:
