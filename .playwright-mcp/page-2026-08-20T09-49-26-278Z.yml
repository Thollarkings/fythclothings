          - paragraph [ref=f2e46]: Students are expected to attend scheduled classes and arrive on time. Where possible, absence should be communicated in advance.
        - generic [ref=f2e47]:
          - heading "Missed Classes" [level=3] [ref=f2e48]
          - paragraph [ref=f2e49]: Missed classes do not automatically qualify for a make-up class. Any make-up arrangement is subject to the trainer's availability and approval.
