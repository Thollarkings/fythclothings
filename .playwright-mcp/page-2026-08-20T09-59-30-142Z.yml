          - paragraph [ref=f4e37]: Training fees are based on the programme agreed with the student. Any outstanding balance must be paid according to the agreed payment arrangement.
        - generic [ref=f4e38]:
          - heading "STRICT NO-REFUND POLICY" [level=3] [ref=f4e39]
          - paragraph [ref=f4e40]: ALL PAYMENTS MADE FOR TRAINING ARE STRICTLY NON-REFUNDABLE. ONCE PAYMENT HAS BEEN MADE, NO REFUND WILL BE ISSUED, WHETHER OR NOT THE STUDENT COMPLETES THE TRAINING.
        - generic [ref=f4e41]:
          - heading "Materials & Tools" [level=3] [ref=f4e42]
          - paragraph [ref=f4e43]: Students are responsible for providing their personal sewing tools, fabrics and other materials required for training unless otherwise agreed.
        - generic [ref=f4e44]:
          - heading "Attendance & Punctuality" [level=3] [ref=f4e45]
          - paragraph [ref=f4e46]: Students are expected to attend scheduled classes and arrive on time. Where possible, absence should be communicated in advance.
        - generic [ref=f4e47]:
          - heading "Missed Classes" [level=3] [ref=f4e48]
          - paragraph [ref=f4e49]: Missed classes do not automatically qualify for a make-up class. Any make-up arrangement is subject to the trainer's availability and approval.
        - generic [ref=f4e50]:
          - heading "Practice & Progress" [level=3] [ref=f4e51]
          - paragraph [ref=f4e52]: Students are encouraged to practise between lessons. Progress depends on attendance, participation, practice and commitment.
        - generic [ref=f4e53]:
          - heading "Conduct" [level=3] [ref=f4e54]
          - paragraph [ref=f4e55]: Students are expected to treat the trainer and other students with respect. Abusive, threatening or disruptive behaviour will not be accepted.
        - generic [ref=f4e56]:
          - heading "Training Content" [level=3] [ref=f4e57]
          - paragraph [ref=f4e58]: Training content may be adjusted according to the student's level, progress, learning needs and agreed programme.
        - generic [ref=f4e59]:
          - heading "Photos & Videos" [level=3] [ref=f4e60]
          - paragraph [ref=f4e61]: Students may be photographed or recorded during training for documentation or promotional purposes only where consent has been given.
        - generic [ref=f4e62]:
